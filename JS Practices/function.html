<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    
    <script>
        function add(a, b) {
    return a + b;

}
add(5, 10); // This will return 15


// ***Types of Functions*** //

// **Named Functions** //

const add = function(a, b) {
    return a + b; 
}

//  **Arrow Functions** 

const add = (a, b) => {
    return a + b;
};

//  **Anonymous Function** //
setTimeout(function() {
     console.log("Hi"); }, 1000);
    </script>
</body>
</html>
